name: Compilar IsA completo

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Plataforma (todas, windows, macos-arm64, macos-intel, linux)'
        default: todas
  push:
    tags:
      - 'v*'

jobs:
  # Plataformas a compilar (todas, o la elegida al lanzar el flujo a mano)
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          ELEGIDA: ${{ inputs.plataforma || 'todas' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          todas = [
              # Windows Server 2025 x64: el resultado funciona en Windows 10 y 11 de 64 bits
              {"id": "windows", "nombre": "Windows 11 (x64)", "os": "windows-2025",
               "paquete": "IsA-windows-x64.zip", "artefacto": "IsA-windows-x64"},
              # macos-15 es arm64 (Apple Silicon): funciona en M1, M2, M3, M4 y M5
              {"id": "macos-arm64", "nombre": "macOS (Apple Silicon)", "os": "macos-15",
               "paquete": "IsA-macos-arm64.dmg", "artefacto": "IsA-macos-arm64"},
              # macos-15-intel es x86_64: funciona en Mac con procesador Intel
              {"id": "macos-intel", "nombre": "macOS (Intel)", "os": "macos-15-intel",
               "paquete": "IsA-macos-intel.dmg", "artefacto": "IsA-macos-intel"},
              # Ubuntu 24.04 (glibc 2.39): funciona en Ubuntu 24.04 o posterior
              {"id": "linux", "nombre": "Linux (Ubuntu 24.04+)", "os": "ubuntu-24.04",
               "paquete": "IsA-linux-x86_64.tar.gz", "artefacto": "IsA-linux-x86_64"},
          ]
          elegida = os.environ["ELEGIDA"].strip()
          sel = [t for t in todas if elegida in ("", "todas", t["id"])]
          if not sel:
              raise SystemExit(f"Plataforma desconocida: {elegida}")
          print("matrix=" + json.dumps({"include": sel}))
          PY

  build:
    name: ${{ matrix.nombre }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      # Firma y notarización de macOS: opcionales. Sin estos secretos se firma ad hoc.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: "Paquetes del sistema (Linux: Tk y pantalla virtual para la prueba)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tk8.6 xvfb xauth

      - name: Comprobar arquitectura y Tk
        run: python -c "import platform, tkinter; print(platform.system(), platform.machine(), 'Tk', tkinter.Tcl().eval('info patchlevel'))"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.id }}" == "macos-intel" ]]; then
            # cryptography compilada desde el código choca con el libssl de PyInstaller en
            # Intel: se instala siempre la versión precompilada (wheel)
            sed 's/^cryptography==.*/cryptography>=42,<51/' requirements-ci.txt > requirements-intel.txt
            pip install --only-binary=cryptography -r requirements-intel.txt
          else
            pip install -r requirements-ci.txt
          fi

      # Sin paso de pyarmor: la licencia no admite CI. Los scripts llegan ya ofuscados en
      # obf_win/, obf_mac/, obf_mac_intel/ y obf_linux/ (generados en Windows con obfuscate.py).

      - name: Importar certificado de firma (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "ISA_CODESIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Compilar IsA y crear el paquete
        run: bash build.sh

      # Prueba de arranque: el menú y cada módulo deben seguir abiertos pasados unos
      # segundos. La licencia de prueba es un secreto cifrado del repositorio y se instala
      # después de crear el paquete (no se distribuye).
      - name: Prueba de arranque de los programas
        env:
          ISA_CI_LICENSE: ${{ secrets.ISA_CI_LICENSE }}
        run: |
          case "$RUNNER_OS" in
            Windows) CFG="dist/IsA"; BIN="dist/IsA" ;;
            macOS)   CFG="$HOME/Library/Application Support/IsA"; BIN="dist/IsA.app/Contents/MacOS" ;;
            Linux)   CFG="$HOME/.config/IsA"; BIN="dist/IsA" ;;
          esac
          python ci/licencia_prueba.py "$CFG"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            Xvfb :99 -screen 0 1920x1080x24 &
            sleep 2
            export DISPLAY=:99
          fi
          status=0
          bash ci/probar_modulos.sh "$BIN" "$CFG/config.MENU" || status=$?
          rm -f "$CFG/config.MENU"
          exit $status

      - name: Prueba de arranque en Ubuntu 24.04 limpio
        if: runner.os == 'Linux'
        env:
          ISA_CI_LICENSE: ${{ secrets.ISA_CI_LICENSE }}
        run: |
          LIC="$RUNNER_TEMP/licencia_docker"
          python ci/licencia_prueba.py "$LIC"
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/ci:/ci:ro" -v "$LIC:/lic:ro" ubuntu:24.04 bash -c '
            set -e
            apt-get update >/dev/null
            # fontconfig y una fuente: sin ellas Tk no puede crear ventanas; cualquier
            # escritorio Ubuntu las trae (la imagen de docker no)
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth fontconfig fonts-dejavu-core >/dev/null
            mkdir -p /root/.config/IsA && cp /lic/config.MENU /root/.config/IsA/
            cd /tmp && tar xzf /dist/IsA-linux-x86_64.tar.gz
            Xvfb :99 -screen 0 1920x1080x24 & sleep 2
            DISPLAY=:99 bash /ci/probar_modulos.sh /tmp/IsA /root/.config/IsA/config.MENU'
          rm -rf "$LIC"

      - name: Notarizar DMG (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != '' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit "dist/${{ matrix.paquete }}" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/${{ matrix.paquete }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: dist/${{ matrix.paquete }}
          # 7 días: descargue el resultado al terminar (en un repositorio público no ocupa cuota)
          retention-days: 7
          compression-level: 0
